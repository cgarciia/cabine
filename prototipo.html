<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CabiNET</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      margin: 0;
      background: #f4f7f6;
      color: #0f172a;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    }
    button, input { font-family: inherit; }
    h1, h2 { font-weight: 500; color: #08060d; margin: 0; }
    p { margin: 0; }
    .kiosk-shell {
      min-height: 100svh; width: 100%; overflow-x: hidden;
      background:
        radial-gradient(1000px 420px at 15% -5%, rgba(15, 118, 110, 0.14), transparent 55%),
        radial-gradient(800px 360px at 90% 0%, rgba(14, 116, 144, 0.1), transparent 50%),
        #f4f7f6;
      color: #0f172a; display: flex; flex-direction: column;
    }
    .kiosk-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; gap: 12px; }
    .kiosk-user { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
    .kiosk-user-avatar {
      width: 40px; height: 40px; border-radius: 999px;
      background:
        radial-gradient(circle at 50% 38%, #fff 0 28%, transparent 29%),
        radial-gradient(circle at 50% 78%, #fff 0 34%, transparent 35%),
        #0f766e;
    }
    .kiosk-main {
      flex: 1; display: flex; flex-direction: column;
      padding: 0.5rem 1.25rem 1.75rem; width: min(720px, 100%);
      max-width: 100%; margin: 0 auto; min-width: 0;
    }
    .kiosk-main:has(.kiosk-menu),
    .kiosk-main:has(.kiosk-quiz),
    .kiosk-main:has(.kiosk-report),
    .kiosk-main:has(.kiosk-step-complete),
    .kiosk-main:has(.kiosk-login-wide) { width: min(1100px, 100%); }
    .kiosk-center-card, .kiosk-menu, .kiosk-quiz, .kiosk-login {
      display: flex; flex-direction: column; gap: 1rem; flex: 1; justify-content: center;
    }
    .kiosk-login { justify-content: center; max-width: 28rem; width: 100%; margin-inline: auto; text-align: center; }
    .kiosk-login .kiosk-back { align-self: center; }
    .kiosk-login-value {
      min-height: 4.5rem; display: grid; place-items: center; padding: 0.75rem 1rem;
      border-radius: 18px; border: 2px solid #0f766e; background: #fff;
      font-size: clamp(1.55rem, 5vw, 2.1rem); font-weight: 750; letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums; color: #0f172a; text-align: center;
    }
    .kiosk-login-value.is-empty { color: #94a3b8; letter-spacing: 0.12em; }
    .kiosk-numpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; }
    .kiosk-numpad-key {
      min-height: 4.4rem; border: 1px solid #dbe4e2; border-radius: 18px; background: #fff;
      color: #0f172a; font-size: 1.65rem; font-weight: 750; cursor: pointer;
      display: grid; place-items: center; touch-action: manipulation; user-select: none;
    }
    .kiosk-numpad-key:hover, .kiosk-numpad-key:focus-visible { border-color: #0f766e; outline: none; }
    .kiosk-numpad-key:active { background: #ecfdf5; transform: scale(0.98); }
    .kiosk-numpad-key:disabled { opacity: 0.55; cursor: not-allowed; }
    .kiosk-numpad-key-action { color: #0f766e; }
    .kiosk-login-wide { max-width: 46rem; }
    .kiosk-login-value.is-text { font-size: clamp(1.2rem, 3.4vw, 1.7rem); letter-spacing: 0.02em; line-height: 1.25; word-break: break-word; }
    .kiosk-choice-stack { width: 100%; }
    .kiosk-keyboard { display: flex; flex-direction: column; gap: 0.4rem; }
    .kiosk-keyboard-row, .kiosk-keyboard-accents { display: flex; justify-content: center; gap: 0.35rem; }
    .kiosk-keyboard-row.is-bottom { padding-inline: 0.2rem; }
    .kiosk-keyboard-key {
      flex: 1 1 0; min-height: 3.05rem; border: 1px solid #dbe4e2; border-radius: 12px;
      background: #fff; color: #0f172a; font-size: 1.12rem; font-weight: 700; cursor: pointer;
      display: grid; place-items: center; touch-action: manipulation; user-select: none;
    }
    .kiosk-keyboard-key-accent { flex: 1 1 0; min-height: 2.7rem; font-size: 1.05rem; }
    .kiosk-keyboard-key-action { flex: 1.15 1 0; color: #0f766e; }
    .kiosk-keyboard-key-action.is-on { background: #ecfdf5; border-color: #0f766e; }
    .kiosk-keyboard-key-space { flex: 1 1 auto; max-width: 22rem; min-height: 3.15rem; }
    .kiosk-keyboard-key:hover, .kiosk-keyboard-key:focus-visible { border-color: #0f766e; outline: none; }
    .kiosk-keyboard-key:active { background: #ecfdf5; transform: scale(0.98); }
    .kiosk-keyboard-key:disabled { opacity: 0.55; cursor: not-allowed; }
    .kiosk-report { width: min(100%, 1100px); margin-inline: auto; display: flex; flex-direction: column; gap: 0.85rem; flex: 1; }
    .kiosk-brand-mark {
      width: 72px; height: 72px; border-radius: 22px;
      background: linear-gradient(160deg, #0f766e, #115e59); color: #fff;
      display: grid; place-items: center; font-size: 2rem; font-weight: 800; margin: 0 auto 0.5rem;
    }
    .kiosk-title { margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); line-height: 1.15; text-align: center; color: #0f172a; font-weight: 750; }
    .kiosk-subtitle { margin: 0; text-align: center; color: #64748b; font-size: 1.1rem; line-height: 1.4; }
    .kiosk-field { display: flex; flex-direction: column; gap: 8px; color: #475569; font-weight: 600; font-size: 0.95rem; }
    .kiosk-input {
      font: inherit; border: 1px solid #e2e8f0; background: #fff; color: #0f172a;
      width: 100%; border-radius: 12px; padding: 10px 12px;
    }
    .kiosk-choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kiosk-choice, .kiosk-option, .kiosk-btn {
      min-height: 58px; border-radius: 16px; border: 1px solid #e2e8f0; background: #fff;
      font-size: 1.1rem; font-weight: 700; color: #0f172a; cursor: pointer; touch-action: manipulation;
    }
    .kiosk-choice.selected, .kiosk-option.selected {
      background: #ecfdf5; border-color: #0f766e; color: #115e59;
      box-shadow: inset 0 0 0 2px rgba(15, 118, 110, 0.25);
    }
    .kiosk-btn { display: inline-flex; align-items: center; justify-content: center; padding: 0 1.25rem; gap: 8px; }
    .kiosk-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .kiosk-btn-primary { background: #0f766e; border-color: #0f766e; color: #fff; }
    .kiosk-btn-secondary { background: #0f172a; border-color: #0f172a; color: #fff; }
    .kiosk-btn-ghost { background: transparent; }
    .kiosk-btn-xl { min-height: 68px; font-size: 1.25rem; border-radius: 18px; }
    .kiosk-link-btn, .kiosk-back {
      background: none; border: 0; color: #0f766e; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; padding: 12px; touch-action: manipulation; display: inline-flex; align-items: center; gap: 6px;
    }
    .kiosk-back { align-self: flex-start; color: #64748b; }
    .kiosk-error { margin: 0; color: #b91c1c; font-weight: 600; text-align: center; }
    .kiosk-muted { color: #64748b; margin: 0; }
    .kiosk-hamburger {
      width: 52px; height: 52px; border-radius: 14px; border: 1px solid #e2e8f0; background: #fff;
      display: grid; place-items: center; color: #0f172a; align-self: flex-start; cursor: pointer; padding: 0;
    }
    .kiosk-menu { justify-content: flex-start; gap: 1.35rem; padding-top: 0.25rem; }
    .kiosk-menu-heading { display: flex; flex-direction: column; gap: 0.55rem; max-width: 40rem; margin: 0 auto; }
    .kiosk-menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; }
    .kiosk-menu-tile {
      display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
      min-height: 132px; padding: 1.15rem 1.2rem; text-align: left; border-radius: 22px;
      border: 1px solid #dbe4e8; background: linear-gradient(180deg, #ffffff 0%, #f7fbfa 100%);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06); color: #0f172a; cursor: pointer;
      touch-action: manipulation; transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }
    .kiosk-menu-tile:hover, .kiosk-menu-tile:focus-visible {
      transform: translateY(-2px); border-color: #99c9c3; box-shadow: 0 14px 32px rgba(15, 118, 110, 0.12); outline: none;
    }
    .kiosk-menu-tile.is-done { border-color: #a7f3d0; background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%); }
    .kiosk-menu-tile-icon {
      width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
      background: #ecfdf5; color: #0f766e; flex-shrink: 0;
    }
    .kiosk-menu-tile-icon svg { width: 28px; height: 28px; display: block; }
    .kiosk-menu-tile-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .kiosk-menu-tile-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .kiosk-menu-tile-top strong { font-size: clamp(1.15rem, 2.4vw, 1.35rem); font-weight: 800; line-height: 1.2; }
    .kiosk-menu-tile-desc { color: #64748b; font-size: 0.98rem; font-weight: 500; line-height: 1.4; }
    .kiosk-menu-tile-arrow { color: #94a3b8; flex-shrink: 0; display: block; }
    .kiosk-menu-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 0.35rem; }
    .kiosk-menu-actions { display: flex; flex-direction: column; gap: 12px; }
    .kiosk-done-pill {
      font-style: normal; font-size: 0.75rem; font-weight: 800; color: #047857;
      background: #d1fae5; border-radius: 999px; padding: 5px 10px; letter-spacing: 0.02em;
    }
    @media (max-width: 820px) {
      .kiosk-menu-grid { grid-template-columns: 1fr; }
      .kiosk-menu-tile { min-height: 118px; }
    }
    .kiosk-quiz-meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: end; }
    .kiosk-quiz-progress-label { font-weight: 800; color: #334155; margin-bottom: 8px; }
    .kiosk-quiz-eta { color: #64748b; font-weight: 700; white-space: nowrap; flex-shrink: 0; align-self: center; padding-bottom: 2px; }
    .kiosk-progress-track { height: 10px; border-radius: 999px; background: #e2e8f0; overflow: hidden; width: 100%; }
    .kiosk-progress-fill { height: 100%; background: linear-gradient(90deg, #0f766e, #0ea5e9); border-radius: 999px; transition: width 0.25s ease; }
    .kiosk-quiz-heading { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .kiosk-quiz-heading .kiosk-back { margin: 0; padding: 4px 2px; }
    .kiosk-quiz-category { color: #0f766e; font-weight: 800; font-size: 1rem; }
    .kiosk-quiz-question { margin: 0; font-size: clamp(1.45rem, 3.5vw, 2rem); line-height: 1.25; color: #0f172a; }
    .kiosk-option-list { display: flex; flex-direction: column; gap: 12px; }
    .kiosk-quiz { justify-content: flex-start; gap: 1.35rem; width: 100%; padding-top: 0.35rem; overflow-x: clip; }
    .kiosk-quiz .kiosk-quiz-meta { width: 100%; padding: 0.85rem 1rem; border-radius: 18px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04); }
    .kiosk-quiz .kiosk-quiz-progress-label { font-size: 1.15rem; margin-bottom: 10px; }
    .kiosk-quiz .kiosk-quiz-eta { font-size: 1.05rem; }
    .kiosk-quiz .kiosk-progress-track { height: 14px; }
    .kiosk-quiz .kiosk-quiz-category { font-size: 1.15rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .kiosk-quiz .kiosk-quiz-question { font-size: clamp(1.85rem, 4.2vw, 2.55rem); font-weight: 800; line-height: 1.2; max-width: 38rem; }
    .kiosk-quiz .kiosk-subtitle { font-size: clamp(1.15rem, 2.4vw, 1.35rem); max-width: 40rem; line-height: 1.45; }
    .kiosk-quiz .kiosk-option-list { gap: 14px; width: 100%; margin-top: 0.35rem; }
    .kiosk-quiz .kiosk-option {
      min-height: 84px; padding: 1.2rem 1.35rem; border-radius: 20px;
      font-size: clamp(1.2rem, 2.5vw, 1.4rem); font-weight: 750; text-align: left;
      border: 1px solid #dbe4e8; background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
    }
    .kiosk-quiz .kiosk-option:hover, .kiosk-quiz .kiosk-option:focus-visible {
      transform: translateY(-1px); border-color: #99c9c3; box-shadow: 0 12px 28px rgba(15, 118, 110, 0.1); outline: none;
    }
    .kiosk-quiz .kiosk-option.selected { background: #ecfdf5; border-color: #0f766e; color: #115e59; box-shadow: inset 0 0 0 2px rgba(15, 118, 110, 0.28); }
    .kiosk-option-scale { display: flex; align-items: center; gap: 0.9rem; }
    .kiosk-shell svg { width: 22px; height: 22px; flex-shrink: 0; }
    .kiosk-option-face { width: 2.15rem; height: 2.15rem; flex-shrink: 0; }
    .kiosk-success-ring svg { width: 40px; height: 40px; }
    .kiosk-numpad-key svg { width: 28px; height: 28px; }
    .kiosk-scroll-hint svg { width: 26px; height: 26px; }
    .kiosk-quiz-hint { margin: -0.35rem 0 0; color: #475569; font-size: 1.05rem; font-weight: 600; }
    .kiosk-check {
      width: 1.75rem; height: 1.75rem; flex-shrink: 0; border-radius: 8px; border: 2px solid #94a3b8;
      background: #fff; display: grid; place-items: center;
    }
    .kiosk-check.is-on { border-color: #0f766e; background: #0f766e; }
    .kiosk-check-mark { width: 1rem; height: 1rem; color: #fff; display: block; }
    .kiosk-quiz.has-advance { padding-bottom: 6.75rem; }
    .kiosk-quiz-end { height: 1px; width: 100%; }
    .kiosk-quiz-advance {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 24; display: flex; justify-content: center;
      padding: 0.9rem 1.25rem calc(0.9rem + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(244, 247, 246, 0) 0%, #f4f7f6 42%); pointer-events: none;
    }
    .kiosk-quiz-advance .kiosk-btn { pointer-events: auto; width: min(1100px, calc(100% - 2.5rem)); }
    .kiosk-scroll-hint {
      position: fixed; right: max(1.25rem, calc((100vw - min(1100px, 100vw)) / 2 + 1.5rem));
      bottom: 6.4rem; z-index: 25; width: 3.1rem; height: 3.1rem; border: 0; border-radius: 999px;
      background: #0f172a; color: #fff; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22); animation: kiosk-scroll-bounce 1.4s ease-in-out infinite;
    }
    @keyframes kiosk-scroll-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
    .kiosk-quiz .kiosk-option.scale-good { border-left: 7px solid #22c55e; }
    .kiosk-quiz .kiosk-option.scale-ok { border-left: 7px solid #84cc16; }
    .kiosk-quiz .kiosk-option.scale-mid { border-left: 7px solid #eab308; }
    .kiosk-quiz .kiosk-option.scale-poor { border-left: 7px solid #f97316; }
    .kiosk-quiz .kiosk-option.scale-bad { border-left: 7px solid #ef4444; }
    .kiosk-quiz .kiosk-quiz-followup { margin: 0.5rem 0 0.25rem; font-size: 1.1rem; }
    .kiosk-quiz .kiosk-quiz-followup .kiosk-input { min-height: 72px; font-size: 1.25rem; border-radius: 18px; padding: 16px 18px; }
    .kiosk-quiz .kiosk-btn { min-height: 72px; font-size: 1.25rem; border-radius: 18px; }
    .kiosk-quiz .kiosk-band { padding: 1.25rem 1.35rem; border-radius: 20px; font-size: 1.15rem; }
    .kiosk-quiz .kiosk-band strong { font-size: 1.35rem; }
    .kiosk-quiz .kiosk-advice-list { font-size: 1.1rem; max-width: 42rem; }
    @media (max-width: 720px) {
      .kiosk-quiz .kiosk-quiz-meta { grid-template-columns: 1fr; }
      .kiosk-quiz .kiosk-option { min-height: 74px; padding: 1.05rem 1.15rem; }
      .kiosk-quiz .kiosk-quiz-question { font-size: clamp(1.55rem, 6vw, 1.9rem); }
    }
    .kiosk-band { border-radius: 18px; padding: 1rem 1.15rem; margin: 0.75rem 0 1rem; border: 1px solid #e2e8f0; background: #f8fafc; }
    .kiosk-band strong { display: block; margin-bottom: 0.35rem; color: #0f172a; }
    .kiosk-band p { margin: 0; color: #334155; line-height: 1.45; }
    .kiosk-band.is-ok { background: #ecfdf5; border-color: #a7f3d0; }
    .kiosk-band.is-watch { background: #fffbeb; border-color: #fde68a; }
    .kiosk-band.is-alert { background: #fff7ed; border-color: #fdba74; }
    .kiosk-advice-list { margin: 0.5rem 0 0; padding-left: 1.2rem; color: #334155; line-height: 1.5; text-align: left; max-width: 640px; }
    .kiosk-option { padding: 1rem 1.15rem; text-align: left; }
    .kiosk-step-complete { text-align: center; }
    .kiosk-dots { display: flex; justify-content: center; gap: 8px; }
    .kiosk-dots span { width: 10px; height: 10px; border-radius: 999px; background: #e2e8f0; }
    .kiosk-dots span.active { width: 28px; background: #0f766e; }
    .kiosk-dots span.done { background: #10b981; }
    .kiosk-success-ring {
      width: 84px; height: 84px; border-radius: 999px; margin: 0 auto; display: grid; place-items: center;
      color: #0f766e; background: #ecfdf5; border: 3px solid #99f6e4; animation: kiosk-pop 0.45s ease-out;
    }
    @keyframes kiosk-pop { from { transform: scale(0.85); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
    .kiosk-print-pair { display: flex; flex-direction: column; gap: 0.85rem; }
    .kiosk-report-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 1.1rem; }
    .kiosk-report-card h2 { margin: 0 0 0.75rem; font-size: 1.2rem; color: #0f172a; }
    .kiosk-report-sub { margin: 1.1rem 0 0.45rem; font-size: 0.95rem; color: #0f766e; }
    .kiosk-finding-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .kiosk-finding-list li { background: #f0fdfa; border: 1px solid #ccfbf1; border-radius: 12px; padding: 0.7rem 0.85rem; display: flex; flex-direction: column; gap: 2px; }
    .kiosk-finding-list strong { color: #134e4a; }
    .kiosk-qa-list { margin: 0; padding-left: 1.15rem; display: flex; flex-direction: column; gap: 10px; }
    .kiosk-qa-list li p { margin: 0 0 2px; color: #475569; }
    .kiosk-qa-list li strong { display: block; }
    .kiosk-qa-list li span { display: block; margin-top: 2px; }
    .kiosk-score-row { display: flex; gap: 16px; align-items: center; }
    .kiosk-score-value { font-size: 2.4rem; font-weight: 800; color: #0f766e; }
    .kiosk-score-label { font-weight: 800; font-size: 1.1rem; }
    .kiosk-report-actions { display: flex; gap: 12px; flex-wrap: wrap; width: min(100%, 1100px); margin-inline: auto; }
    .kiosk-history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow: auto; }
    .kiosk-history-item { text-align: left; min-height: 52px; border-radius: 14px; border: 1px solid #e2e8f0; background: #fff; padding: 12px 14px; font-weight: 650; cursor: pointer; }
    .kiosk-history-item.selected { border-color: #0f766e; background: #ecfdf5; }
    .kiosk-sidebar-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 40; }
    .kiosk-sidebar { width: min(320px, 86vw); height: 100%; background: #fff; padding: 1.25rem; display: flex; flex-direction: column; gap: 10px; box-shadow: 8px 0 30px rgba(15, 23, 42, 0.12); }
    .kiosk-sidebar-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 0.5rem; }
    .kiosk-sidebar-item { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; font-weight: 700; padding: 14px 12px; border-radius: 14px; border: 1px solid transparent; background: none; cursor: pointer; font-size: 1rem; width: 100%; text-align: left; }
    .kiosk-sidebar-item.active, .kiosk-sidebar-item:active { background: #ecfdf5; border-color: #99f6e4; color: #115e59; }
    .kiosk-sidebar-close { margin-top: auto; min-height: 52px; border-radius: 14px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .kiosk-modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); display: grid; place-items: center; z-index: 50; padding: 1rem; }
    .kiosk-modal { width: min(420px, 100%); background: #fff; border-radius: 20px; padding: 1.4rem; }
    .kiosk-modal h2 { margin: 0 0 0.5rem; }

        <p class="kiosk-subtitle" style="text-align:left;max-width:640px">${esc(patientResultCopy(m.results))}</p>

        <p class="kiosk-muted" style="margin-top:12px">Este resultado é um rastreio e não estabelece diagnóstico.</p>

  function viewCompletion() {

  }

      accepted: mental.accepted, refused: mental.refused, safetyTriggered: mental.safetyTriggered,

    } : null;
    return layout(`${sessionReport(person, new Date().toLocaleString("pt-BR"), generalHealth, mentalView)}

        <button type="button" class="kiosk-btn kiosk-btn-primary" data-act="print">Imprimir</button>
        <button type="button" class="kiosk-btn kiosk-btn-ghost" data-act="go-menu">${icon("chevron-left")} Voltar ao menu</button>
      </div>`, { showUser: true });
  }
  function viewRecords() {
    if (!store.session.person) { pendingRedirect = { path: "/matricula", replace: true }; return ""; }
    const person = store.session.person;
    const visits = groupSavedVisits(store.forms.filter((f) => f.person_id === person.id));
    const selected = visits.find((v) => v.id === store.records.selectedId) ?? visits[0] ?? null;

    if (selected) {
      report = sessionReport(
        person,

        `<button type="button" class="kiosk-history-item${selected?.id === visit.id ? " selected" : ""}" data-act="pick-visit" data-id="${esc(visit.id)}">${esc(formatVisitWhen(visit.at))}<span class="kiosk-muted" style="display:block;font-weight:500">${esc(visitSummary(visit))}</span></button>`).join("")}</div>`}
    </div>
    ${report}

      ${selected ? `<button type="button" class="kiosk-btn kiosk-btn-primary" data-act="print">Imprimir relatório</button>` : ""}
      <button type="button" class="kiosk-btn kiosk-btn-ghost" data-act="go-menu">${icon("chevron-left")} Voltar ao menu</button>
    </div>`, { showUser: true, activeSidebar: "records" });

  function storeMental(partial) {
    const m = store.mental;
    const next = {
      accepted: partial.accepted ?? true,
      refused: partial.refused,
      gate: partial.gate ?? m.gate.filter((n) => Number.isFinite(n)),
      results: partial.results ?? m.results,
      safetyTriggered: partial.safetyTriggered,
      completedAt: partial.completedAt,
      instrument: partial.instrument ?? m.active,
      instrumentLog: partial.instrumentLog ?? m.instrumentLog,
    };
    store.session.mentalHealth = next;
    return next;
  }
  function saveMental(status, mental) {
    const m = store.mental;
    const payload = {
      invitedAt: m.started,
      accepted: mental.accepted,
      refusedAt: mental.refused ? new Date().toISOString() : undefined,
      gate: mental.gate,
      instrument: mental.instrument,
      results: mental.results,
      safetyTriggered: mental.safetyTriggered,
      completedAt: mental.completedAt,
      startedAt: m.started,
      instrumentLog: m.instrumentLog,
    };
    saveForm("mental", status, mentalPayload(payload));
  }
  function afterInstrument(nextResults, finishedOptional, nextLog) {
    const m = store.mental;
    const who = nextResults.find((item) => item.instrument === "WHO-5");
    const offerHad = !finishedOptional && m.primary === "WHO-5" && (who?.score ?? 100) <= 28 && !nextResults.some((item) => item.instrument === "HAD");
    const offerAudit = !finishedOptional && m.optional === "AUDIT" && !nextResults.some((item) => item.instrument === "AUDIT");
    if (offerHad) { m.optional = "HAD"; m.step = "optional"; render(); return; }
    if (offerAudit) { m.step = "optional"; render(); return; }
    const flagged = needsSafety(nextResults);
    const completedAt = new Date().toISOString();
    const stored = storeMental({
      accepted: true, gate: m.gate.filter((n) => Number.isFinite(n)),
      results: nextResults, safetyTriggered: flagged, completedAt, instrument: m.primary, instrumentLog: nextLog,
    });
    m.instrumentLog = nextLog;
    saveMental("completed", stored);
    m.step = flagged ? "safety" : "result";
    render();
  }
  function finishHealth(nextAnswers, nextDetails) {
    const score = scoreQuestionnaire(GENERAL_HEALTH, nextAnswers, nextDetails);
    store.session.generalHealth = score;
    saveForm("health", "completed", healthKioskPayload(GENERAL_HEALTH, score));
    store.health.completed = true;
    render();
  }
  function goHealthNext(nextAnswers, nextDetails) {
    const h = store.health;
    if (h.index >= GENERAL_HEALTH.questions.length - 1) { finishHealth(nextAnswers, nextDetails); return; }
    h.index += 1;
    h.flashId = null;
    render();
  }

  function attachHealthObserver() {
    const el = document.querySelector(".kiosk-quiz-end");
    const h = store.health;
    if (!el || !h) return;
    const question = GENERAL_HEALTH.questions[h.index];
    if (!question) return;
    const selected = h.answers[question.id] ?? [];
    const showFollowUp = followUpVisible(question, selected);
    const needsManualNext = Boolean(question.kind === "multiple" || showFollowUp || (question.followUpWhenOptionId && selected.includes(question.followUpWhenOptionId)));
    if (!needsManualNext) { h.moreBelow = false; return; }
    let intersecting = false;
    function refresh() {
      const nearBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 32;
      const next = !intersecting && !nearBottom;
      if (next !== h.moreBelow) { h.moreBelow = next; render(); }
    }
    const observer = new IntersectionObserver(([entry]) => { intersecting = entry.isIntersecting; refresh(); }, { root: null, rootMargin: "0px 0px -88px 0px", threshold: 0 });
    observer.observe(el);
    window.addEventListener("scroll", refresh, { passive: true });
    refresh();
    observerCleanup = () => { observer.disconnect(); window.removeEventListener("scroll", refresh); };
  }

  function lookupPerson(matricula) {
    const key = matricula.trim();
    return store.people.find((p) => p.matricula === key) || null;
  }

  function onAction(act, el) {
    const route = parseRoute();
    if (act === "ask-end") { store.confirmEnd = true; render(); return; }
    if (act === "cancel-end") { store.confirmEnd = false; render(); return; }
    if (act === "confirm-end") { clearSession(); store.login = { step: "registration", employeeId: "", birthDigits: "", error: "" }; navigate("/", true); return; }
    if (act === "open-sidebar") { store.sidebarOpen = true; render(); return; }
    if (act === "close-sidebar") { store.sidebarOpen = false; render(); return; }
    if (act === "edit-cadastro") { store.sidebarOpen = false; store.cadastro = emptyCadastro("", true); navigate("/cadastro?edit=1"); return; }
    if (act === "go-records") { store.sidebarOpen = false; store.records.selectedId = null; navigate("/registros"); return; }
    if (act === "go-matricula") { store.login = { step: "registration", employeeId: "", birthDigits: "", error: "" }; navigate("/matricula"); return; }
    if (act === "go-menu") { store.health = null; store.mental = null; navigate("/menu", true); return; }
    if (act === "go-path") { store.health = null; store.mental = null; if (el.dataset.path === "/saude-geral") store.health = emptyHealth(); if (el.dataset.path === "/saude-mental") store.mental = emptyMental(); navigate(el.dataset.path); return; }
    if (act === "after-next") { store.health = null; store.mental = null; if (el.dataset.path === "/saude-geral") store.health = emptyHealth(); if (el.dataset.path === "/saude-mental") store.mental = emptyMental(); navigate(el.dataset.path, true); return; }
    if (act === "print") { window.print(); return; }
    if (act === "pick-visit") { store.records.selectedId = el.dataset.id; render(); return; }

    if (act === "login-digit") {
      store.login.error = "";
      if (store.login.step === "registration") {
        if (store.login.employeeId.length < 40) store.login.employeeId += el.dataset.digit;
      } else if (store.login.step === "birthDate" && store.login.birthDigits.length < 8) {
        store.login.birthDigits += el.dataset.digit;
      }
      render(); return;
    }
    if (act === "login-bs") {
      store.login.error = "";
      if (store.login.step === "registration") store.login.employeeId = store.login.employeeId.slice(0, -1);
      else if (store.login.step === "birthDate") store.login.birthDigits = store.login.birthDigits.slice(0, -1);
      render(); return;
    }
    if (act === "login-continue") {
      const value = store.login.employeeId.trim();
      if (!value) { store.login.error = "Informe a matrícula."; render(); return; }
      store.login.error = "";
      store.login.step = lookupPerson(value) ? "birthDate" : "firstAccess";
      store.login.birthDigits = "";
      render(); return;
    }
    if (act === "login-enter") {
      const iso = digitsToIsoDate(store.login.birthDigits);
      if (!iso) { store.login.error = "Informe uma data de nascimento válida."; render(); return; }
      const person = lookupPerson(store.login.employeeId);
      if (!person || !person.matricula || !person.birth_date || person.birth_date !== iso) {
        store.login.error = "Matrícula ou data de nascimento incorretas.";
        render(); return;
      }
      store.access = true;
      beginVisit(person);
      navigate("/menu", true); return;
    }
    if (act === "login-back-reg") {
      store.login.error = ""; store.login.birthDigits = ""; store.login.step = "registration"; render(); return;
    }
    if (act === "go-cadastro-new") {
      const value = store.login.employeeId.trim();
      store.cadastro = emptyCadastro(value, false);
      navigate(`/cadastro?matricula=${encodeURIComponent(value)}`); return;
    }

    const c = store.cadastro;
    if (c && (act.startsWith("cad-") || act.startsWith("kb-"))) {
      const editing = route.search.get("edit") === "1";
      const steps = c.skipRegistration ? ["name", "birthDate", "sex", "height"] : ["registration", "name", "birthDate", "sex", "height"];
      const stepIndex = Math.max(0, steps.indexOf(c.step));
      if (act === "cad-back") {
        c.error = "";
        if (stepIndex <= 0) { navigate(editing ? "/menu" : "/matricula"); return; }
        c.step = steps[stepIndex - 1]; render(); return;
      }
      if (act === "cad-digit") {
        c.error = "";
        if (c.step === "registration" && c.form.employeeId.length < 40) c.form.employeeId += el.dataset.digit;
        else if (c.step === "birthDate" && c.birthDigits.length < 8) c.birthDigits += el.dataset.digit;
        else if (c.step === "height") c.form.heightCm = `${c.form.heightCm}${el.dataset.digit}`.replace(/^0+(?=\d)/, "").slice(0, 3);
        render(); return;
      }
      if (act === "cad-bs") {
        c.error = "";
        if (c.step === "registration") c.form.employeeId = c.form.employeeId.slice(0, -1);
        else if (c.step === "birthDate") c.birthDigits = c.birthDigits.slice(0, -1);
        else if (c.step === "height") c.form.heightCm = c.form.heightCm.slice(0, -1);
        render(); return;
      }
      if (act === "kb-char") {
        c.error = "";
        const raw = el.dataset.char;
        const nextChar = (c.shifted !== false) ? raw.toUpperCase() : raw;
        if (c.form.name.length < 120) {
          const add = nextChar === " " && c.form.name.endsWith(" ") ? "" : nextChar;
          if (add) c.form.name += add;
        }
        c.shifted = false;
        render(); return;
      }
      if (act === "kb-bs") { c.error = ""; c.form.name = c.form.name.slice(0, -1); render(); return; }
      if (act === "kb-shift") { c.shifted = c.shifted === false; render(); return; }
      if (act === "kb-space") { c.error = ""; if (c.form.name.length < 120 && !c.form.name.endsWith(" ")) c.form.name += " "; c.shifted = true; render(); return; }
      if (act === "cad-sex") { c.error = ""; c.form.sex = el.dataset.value; c.step = "height"; render(); return; }
      if (act === "cad-next") {
        if (c.step === "registration") {
          if (!c.form.employeeId.trim()) { c.error = "Informe a matrícula."; render(); return; }
          c.error = ""; c.step = steps[stepIndex + 1]; render(); return;
        }
        if (c.step === "name") {
          if (c.form.name.trim().length < 2) { c.error = "Informe o nome completo."; render(); return; }
          c.error = ""; c.step = steps[stepIndex + 1]; render(); return;
        }
        if (c.step === "birthDate") {
          const iso = digitsToIsoDate(c.birthDigits);
          if (!iso) { c.error = "Informe uma data de nascimento válida."; render(); return; }
          c.form.birthDate = iso; c.error = ""; c.step = steps[stepIndex + 1]; render(); return;
        }
        if (c.step === "sex") {
          if (!c.form.sex) { c.error = "Escolha o gênero."; render(); return; }
          c.error = ""; c.step = steps[stepIndex + 1]; render(); return;
        }
      }
      if (act === "cad-save") {
        const height = Number(c.form.heightCm);
        const iso = c.form.birthDate || digitsToIsoDate(c.birthDigits);
        const years = iso ? ageFromBirth(iso) : null;
        if (!c.form.employeeId.trim() || !c.form.name.trim() || !iso || !c.form.sex) { c.error = "Preencha todos os campos."; render(); return; }
        if (!Number.isFinite(height) || height < 50 || height > 250) { c.error = "Informe uma altura entre 50 e 250 cm."; render(); return; }
        if (years == null) { c.error = "Informe a data de nascimento."; render(); return; }
        const payload = {
          name: c.form.name.trim(), matricula: c.form.employeeId.trim(), height_cm: height,
          birth_date: iso, age: years, sex: c.form.sex, people_type: "normal",
        };
        if (editing && store.session.person) {
          const other = store.people.find((p) => p.matricula === payload.matricula && p.id !== store.session.person.id);
          if (other) { c.error = "Já existe uma pessoa com esta matrícula."; render(); return; }
          Object.assign(store.session.person, payload);
          const idx = store.people.findIndex((p) => p.id === store.session.person.id);
          if (idx >= 0) store.people[idx] = store.session.person;

        } else {
          if (lookupPerson(payload.matricula)) { c.error = "Já existe uma pessoa com esta matrícula."; render(); return; }
          const person = { id: newVisitId(), ...payload };

          store.access = true;
          beginVisit(person);
        }
        store.cadastro = null;
        navigate("/menu", true); return;
      }
    }

    const h = store.health;
    if (h && !h.completed) {
      const def = GENERAL_HEALTH;
      const question = def.questions[h.index];
      if (act === "health-back") {
        if (h.index === 0) { navigate("/menu"); return; }
        h.index -= 1; h.flashId = null; render(); return;
      }
      if (act === "health-scroll") {
        document.querySelector(".kiosk-quiz-end")?.scrollIntoView({ behavior: "smooth", block: "end" });
        return;
      }
      if (act === "health-next") {
        const selected = h.answers[question.id] ?? [];
        if (!isQuestionAnswered(question, selected, h.details[question.id] ?? "")) return;
        goHealthNext(h.answers, h.details); return;
      }
      if (act === "health-opt") {
        const optionId = el.dataset.id;
        if (question.kind === "single") {
          const nextAnswers = { ...h.answers, [question.id]: [optionId] };
          const wantsFollowUp = question.followUpWhenOptionId === optionId;
          const nextDetails = wantsFollowUp ? h.details : (() => { const rest = { ...h.details }; delete rest[question.id]; return rest; })();
          h.answers = nextAnswers; h.details = nextDetails; h.flashId = optionId;
          if (wantsFollowUp) { render(); return; }
          render();
          if (advanceTimer) clearTimeout(advanceTimer);
          advanceTimer = setTimeout(() => goHealthNext(nextAnswers, nextDetails), 280);
          return;
        }
        const exclusive = question.exclusiveOptionId;
        if (exclusive && optionId === exclusive) {
          const nextAnswers = { ...h.answers, [question.id]: [exclusive] };
          const nextDetails = { ...h.details }; delete nextDetails[question.id];
          h.answers = nextAnswers; h.details = nextDetails; h.flashId = optionId;
          render();
          if (advanceTimer) clearTimeout(advanceTimer);
          advanceTimer = setTimeout(() => goHealthNext(nextAnswers, nextDetails), 280);
          return;
        }
        const current = (h.answers[question.id] ?? []).filter((id) => id !== exclusive);
        const nextSelected = current.includes(optionId) ? current.filter((id) => id !== optionId) : [...current, optionId];
        h.answers = { ...h.answers, [question.id]: nextSelected };
        const followUpId = question.followUpOptionId;
        if (followUpId && !nextSelected.includes(followUpId)) { const rest = { ...h.details }; delete rest[question.id]; h.details = rest; }
        render(); return;
      }
    }

    const m = store.mental;
    if (m && m.step !== "done") {
      if (act === "mental-back") {
        if (m.step === "instrument" && m.itemIndex > 0) { m.itemIndex -= 1; render(); return; }

        if (m.step === "instrument" && m.itemIndex === 0) { m.step = "gate"; m.gateIndex = 3; render(); return; }

      }

      if (act === "mental-refuse") {

          m.flashId = null;
          if (m.gateIndex < 3) { m.gateIndex += 1; render(); return; }

          m.primary = routed.primary; m.optional = routed.optional; m.active = routed.primary;
          m.itemIndex = 0; m.answers = [];

          m.step = "instrument"; render();
        }, 220);
        return;
      }
      if (act === "mental-item") {
        const optionIndex = Number(el.dataset.index);
        const items = instrumentItems(m.active);
        const nextAnswers = [...m.answers]; nextAnswers[m.itemIndex] = optionIndex;
        m.flashId = items[m.itemIndex].options[optionIndex]?.label ?? String(optionIndex);
        render();
        if (advanceTimer) clearTimeout(advanceTimer);
        advanceTimer = setTimeout(() => {
          m.flashId = null;
          if (m.itemIndex < items.length - 1) { m.answers = nextAnswers; m.itemIndex += 1; render(); return; }
          const scored = scoreInstrument(m.active, nextAnswers, items);
          const nextResults = [...m.results.filter((item) => item.instrument !== scored.instrument), scored];
          const logEntry = {
            instrument: m.active,
            items: items.map((item, index) => ({
              id: item.id, text: item.text,
              label: item.options[nextAnswers[index]]?.label ?? "",
              score: item.options[nextAnswers[index]]?.score ?? 0,
            })),
          };
          const nextLog = [...m.instrumentLog.filter((entry) => entry.instrument !== m.active), logEntry];
          m.instrumentLog = nextLog; m.results = nextResults; m.answers = []; m.itemIndex = 0;
          afterInstrument(nextResults, m.active !== m.primary, nextLog);
        }, 220);
        return;
      }
      if (act === "mental-opt-yes") {
        m.active = m.optional ?? "HAD"; m.answers = []; m.itemIndex = 0; m.step = "instrument"; render(); return;
      }
      if (act === "mental-opt-no") { afterInstrument(m.results, true, m.instrumentLog); return; }
      if (act === "mental-see-result") { m.step = "result"; render(); return; }
      if (act === "mental-continue") { m.step = "done"; render(); return; }
    }
  }

  function bind() {
    const root = document.getElementById("app");
    root.onclick = (event) => {
      const stop = event.target.closest("[data-stop]");
      if (event.target.closest(".kiosk-sidebar-backdrop") && !event.target.closest("[data-stop]") && event.target.closest("[data-act=close-sidebar]")) {
        /* handled below */
      }
      if (event.target.classList.contains("kiosk-modal-backdrop")) { onAction("cancel-end", event.target); return; }
      if (event.target.classList.contains("kiosk-sidebar-backdrop")) { onAction("close-sidebar", event.target); return; }
      const btn = event.target.closest("[data-act]");
      if (!btn) return;
      event.preventDefault();
      onAction(btn.getAttribute("data-act"), btn);
    };
    root.oninput = (event) => {
      if (event.target.getAttribute("data-act") === "health-detail" && store.health) {
        const q = GENERAL_HEALTH.questions[store.health.index];
        store.health.details = { ...store.health.details, [q.id]: event.target.value };
        const btn = document.querySelector("[data-act=health-next]");
        const selected = store.health.answers[q.id] ?? [];
        if (btn) btn.disabled = !isQuestionAnswered(q, selected, event.target.value);
      }
    };
    root.onkeydown = (event) => {
      if (event.key === "Escape" && store.confirmEnd) { store.confirmEnd = false; render(); }
    };
  }

  function render() {
    clearObserver();
    const route = parseRoute();
    if (!requirePerson(route)) {
      if (pendingRedirect) {
        const next = pendingRedirect;
        pendingRedirect = null;
        navigate(next.path, next.replace);
      }
      return;
    }
    if (route.path === "/matricula" && store.login.step === "registration" && !store.login.employeeId) {
      /* keep */
    }
    if (route.path !== "/saude-geral") store.health = route.path === "/saude-geral" ? (store.health || emptyHealth()) : store.health;
    if (route.path !== "/saude-mental") { /* keep mental only on that page for in-progress? original remounts each visit */ }
    if (route.path !== "/cadastro") store.cadastro = route.path === "/cadastro" ? store.cadastro : null;
    let html = "";
    if (route.path === "/" || route.path === "") html = viewWelcome();
    else if (route.path === "/matricula") html = viewLogin();
    else if (route.path === "/cadastro") html = viewCadastro(route);
    else if (route.path === "/menu") html = viewMenu();
    else if (route.path === "/saude-geral") html = viewHealth();
    else if (route.path === "/saude-mental") html = viewMental();
    else if (route.path === "/conclusao") html = viewCompletion();
    else if (route.path === "/relatorio") html = viewReport();
    else if (route.path === "/registros") html = viewRecords();
    else html = viewWelcome();
    if (html) document.getElementById("app").innerHTML = html;
    if (route.path === "/saude-geral" && store.health && !store.health.completed) {
      const input = document.querySelector("[data-act=health-detail]");
      if (input) input.focus();
      attachHealthObserver();
    }
    if (pendingRedirect) {
      const next = pendingRedirect;
      pendingRedirect = null;
      navigate(next.path, next.replace);
    }
  }

  window.addEventListener("hashchange", () => {
    const route = parseRoute();
    if (route.path === "/saude-geral") store.health = emptyHealth();
    if (route.path === "/saude-mental") store.mental = emptyMental();
    if (route.path === "/cadastro") {
      const editing = route.search.get("edit") === "1";
      const prefill = (route.search.get("matricula") ?? "").trim();
      store.cadastro = emptyCadastro(prefill, editing);
    }
    if (route.path === "/matricula") {
      store.login = { step: "registration", employeeId: "", birthDigits: "", error: "" };
    }
    render();
  });
  bind();
  if (!location.hash) history.replaceState(null, "", "#/");
  render();
})();

  </script>
</body>
